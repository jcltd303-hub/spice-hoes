name: Build Face Embedding QNN

on:
  workflow_dispatch:

concurrency:
  group: face-embedding-qnn
  cancel-in-progress: true

permissions:
  contents: read

env:
  QAIRT_VERSION: "2.50.40.260831"
  QAIRT_URL: "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.40.260831/v2.50.40.260831.zip"
  BUFFALO_URL: "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip"
  ARCFACE_SHA256: "4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qualcomm AI Runtime SDK
        id: cache-qairt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qairt
          key: qairt-${{ runner.os }}-${{ env.QAIRT_VERSION }}

      - name: Download Qualcomm AI Runtime SDK
        if: steps.cache-qairt.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/qairt"
          mkdir -p "$RUNNER_TEMP/qairt"
          curl --fail --location --retry 4 --retry-delay 5 "$QAIRT_URL" -o "$RUNNER_TEMP/qairt.zip"
          unzip -q "$RUNNER_TEMP/qairt.zip" -d "$RUNNER_TEMP/qairt"

      - name: Locate QNN SDK
        run: |
          QNN_INCLUDE="$(find "$RUNNER_TEMP/qairt" -type d -path '*/include/QNN' -print -quit)"
          test -n "$QNN_INCLUDE"
          QNN_SDK_ROOT="$(dirname "$(dirname "$QNN_INCLUDE")")"
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$QNN_SDK_ROOT/lib/python:$QNN_SDK_ROOT/lib/python/qti/aisw/converters:$PYTHONPATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$QNN_SDK_ROOT/bin/x86_64-linux-clang" >> "$GITHUB_PATH"

      - name: Install QAIRT host runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install converter dependencies
        run: python -m pip install numpy onnx

      - name: Download official InsightFace buffalo_l models
        run: |
          mkdir -p work
          curl --fail --location --retry 4 "$BUFFALO_URL" -o work/buffalo_l.zip
          unzip -q work/buffalo_l.zip -d work/buffalo
          test -s work/buffalo/w600k_r50.onnx
          test -s work/buffalo/det_10g.onnx
          echo "$ARCFACE_SHA256  work/buffalo/w600k_r50.onnx" | sha256sum -c -
          sha256sum work/buffalo/det_10g.onnx > work/scrfd_source_sha256.txt

      - name: Inspect model contracts
        run: |
          python - <<'PY'
          import json, onnx, pathlib
          root=pathlib.Path("work/buffalo")
          contracts={}
          for key,name in [("arcface","w600k_r50.onnx"),("scrfd","det_10g.onnx")]:
              m=onnx.load(root/name)
              inp=m.graph.input[0]
              dims=[d.dim_value for d in inp.type.tensor_type.shape.dim]
              outputs=[]
              for out in m.graph.output:
                  outputs.append({
                      "name":out.name,
                      "dims":[d.dim_value for d in out.type.tensor_type.shape.dim],
                  })
              contracts[key]={"input_name":inp.name,"input_dims":dims,"outputs":outputs}
          pathlib.Path("work/contracts.json").write_text(json.dumps(contracts,indent=2))
          print(json.dumps(contracts,indent=2))
          arc=contracts["arcface"]["input_dims"]
          if arc not in ([0,3,112,112],[1,3,112,112]):
              raise SystemExit(f"unexpected ArcFace input: {arc}")
          det=contracts["scrfd"]["input_dims"]
          if len(det)!=4 or det[1]!=3:
              raise SystemExit(f"unexpected SCRFD input: {det}")
          PY

      - name: Build calibration tensors
        run: |
          mkdir -p work/calibration/arcface work/calibration/scrfd
          python - <<'PY'
          import numpy as np, pathlib
          rng=np.random.default_rng(20261001)
          specs=[
              ("arcface",(1,3,112,112),0.45),
              ("scrfd",(1,3,640,640),0.45),
          ]
          for name,shape,std in specs:
              root=pathlib.Path("work/calibration")/name
              lines=[]
              for i in range(24):
                  x=rng.normal(0.0,std,shape).clip(-1,1).astype(np.float32)
                  p=root/f"cal_{i:03d}.raw"
                  x.tofile(p)
                  lines.append(str(p))
              (root/"input_list.txt").write_text("\n".join(lines)+"\n")
          PY

      - name: Resolve QNN converter tools
        run: |
          CONVERTER="$QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-onnx-converter"
          GEN="$QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-model-lib-generator"
          CBG="$QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-context-binary-generator"
          [ -f "$CONVERTER" ] || CONVERTER="$(find "$QNN_SDK_ROOT/bin" -name qnn-onnx-converter -type f -print -quit)"
          [ -f "$GEN" ] || GEN="$(find "$QNN_SDK_ROOT/bin" -name qnn-model-lib-generator -type f -print -quit)"
          test -n "$CONVERTER"
          test -n "$GEN"
          test -x "$CBG"
          echo "CONVERTER=$CONVERTER" >> "$GITHUB_ENV"
          echo "GEN=$GEN" >> "$GITHUB_ENV"
          echo "CBG=$CBG" >> "$GITHUB_ENV"

      - name: Convert ArcFace and SCRFD to QNN
        run: |
          set -eu
          ARC_INPUT="$(python -c 'import json; print(json.load(open("work/contracts.json"))["arcface"]["input_name"])')"
          DET_INPUT="$(python -c 'import json; print(json.load(open("work/contracts.json"))["scrfd"]["input_name"])')"

          python "$CONVERTER"             --input_network work/buffalo/w600k_r50.onnx             --input_dim "$ARC_INPUT" 1,3,112,112             --output_path work/arcface_w600k_r50.cpp             --input_list work/calibration/arcface/input_list.txt

          python "$CONVERTER"             --input_network work/buffalo/det_10g.onnx             --input_dim "$DET_INPUT" 1,3,640,640             --output_path work/scrfd_10g.cpp             --input_list work/calibration/scrfd/input_list.txt

      - name: Build host model libraries
        run: |
          python "$GEN"             -c work/arcface_w600k_r50.cpp             -b work/arcface_w600k_r50.bin             -o work/arcface_libs             -t x86_64-linux-clang
          python "$GEN"             -c work/scrfd_10g.cpp             -b work/scrfd_10g.bin             -o work/scrfd_libs             -t x86_64-linux-clang
          test -s work/arcface_libs/x86_64-linux-clang/libarcface_w600k_r50.so
          test -s work/scrfd_libs/x86_64-linux-clang/libscrfd_10g.so

      - name: Generate Snapdragon v75 HTP contexts
        run: |
          set -eu
          EXT="$(find "$QNN_SDK_ROOT/lib/x86_64-linux-clang" -name 'libQnnHtpNetRunExtensions.so' -print -quit)"
          BACKEND="$QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so"
          test -s "$BACKEND"
          test -s "$EXT"

          cat > work/htp_v75.json <<EOF
          {
            "devices": [{"htp_arch": "v75"}]
          }
          EOF
          cat > work/backend_ext.json <<EOF
          {
            "backend_extensions": {
              "shared_library_path": "$EXT",
              "config_file_path": "$(pwd)/work/htp_v75.json"
            }
          }
          EOF

          mkdir -p work/arcface_context work/scrfd_context
          "$CBG"             --backend "$BACKEND"             --model work/arcface_libs/x86_64-linux-clang/libarcface_w600k_r50.so             --binary_file arcface_w600k_r50             --output_dir work/arcface_context             --config_file work/backend_ext.json
          "$CBG"             --backend "$BACKEND"             --model work/scrfd_libs/x86_64-linux-clang/libscrfd_10g.so             --binary_file scrfd_10g             --output_dir work/scrfd_context             --config_file work/backend_ext.json

          ARC="$(find work/arcface_context -type f -name '*.bin' -print -quit)"
          DET="$(find work/scrfd_context -type f -name '*.bin' -print -quit)"
          test -n "$ARC"
          test -n "$DET"

          mkdir -p artifact/models/face
          cp "$ARC" artifact/models/face/arcface_w600k_r50.bin
          cp "$DET" artifact/models/face/scrfd_10g.bin
          cp work/contracts.json artifact/models/face/contracts.json
          echo "$ARCFACE_SHA256" > artifact/models/face/arcface_source_sha256.txt
          cp work/scrfd_source_sha256.txt artifact/models/face/scrfd_source_sha256.txt

      - name: Upload face runtime models
        uses: actions/upload-artifact@v4
        with:
          name: spice-face-qnn-v75
          path: artifact/
          if-no-files-found: error
