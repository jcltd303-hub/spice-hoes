name: Android Identity APK
on:
  push:
    branches: [main, android/identity-service]
    paths:
      - "android/identity-service/**"
      - ".github/workflows/android-identity.yml"
  pull_request:
    paths:
      - "android/identity-service/**"
      - ".github/workflows/android-identity.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android/identity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spice-identity-debug-apk
          path: android/identity-service/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
